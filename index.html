<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151829">
  <title>Nova Calculator</title>
  <style>
    :root {
      --page: #eef1ff;
      --shell: rgba(22, 25, 45, 0.94);
      --screen: #101321;
      --key: #2a2f4d;
      --key-hover: #383f65;
      --text: #f8f8ff;
      --muted: #a9b0ce;
      --purple: #8d71ff;
      --teal: #2bc2aa;
      --danger: #ff6d9e;
      --line: rgba(255, 255, 255, 0.09);
      --shadow: 0 28px 70px rgba(48, 42, 104, 0.27);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #181b30;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 16% 16%, rgba(141, 113, 255, 0.37), transparent 24rem),
        radial-gradient(circle at 85% 84%, rgba(43, 194, 170, 0.23), transparent 22rem),
        linear-gradient(135deg, #f8f9ff 0%, var(--page) 52%, #e6e8fb 100%);
    }

    button { font: inherit; }

    .app {
      width: min(100%, 770px);
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(235px, 1fr);
      align-items: stretch;
      gap: 18px;
    }

    .calculator,
    .history-panel {
      border: 1px solid var(--line);
      background: var(--shell);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .calculator {
      border-radius: 30px;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 2px 20px;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--text);
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: white;
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--purple), #b1a0ff);
      box-shadow: 0 7px 18px rgba(141, 113, 255, 0.32);
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: -0.025em;
    }

    .keyboard-hint {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-toggle {
      border: 1px solid rgba(141, 113, 255, 0.35);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      color: #eae5ff;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(141, 113, 255, 0.2);
    }

    .mode-toggle:hover,
    .mode-toggle[aria-pressed="true"] { background: rgba(141, 113, 255, 0.38); }

    .mode-toggle:focus-visible { outline: 2px solid #c7bcff; outline-offset: 2px; }

    .display {
      min-height: 157px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 23px;
      background:
        radial-gradient(circle at 90% 12%, rgba(141, 113, 255, 0.16), transparent 9rem),
        var(--screen);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .expression {
      min-height: 22px;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: right;
    }

    .result {
      margin-top: 9px;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: clamp(2.45rem, 8vw, 3.45rem);
      font-weight: 750;
      letter-spacing: -0.065em;
      line-height: 1.05;
      text-align: right;
    }

    .result.error { color: var(--danger); font-size: 2.15rem; letter-spacing: -0.04em; }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
    }

    .key {
      min-height: 59px;
      border: 1px solid transparent;
      border-radius: 17px;
      cursor: pointer;
      color: var(--text);
      font-size: 1.08rem;
      font-weight: 740;
      background: var(--key);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 5px 11px rgba(4, 7, 24, 0.15);
      transition: transform 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .key:hover { background: var(--key-hover); transform: translateY(-2px); }
    .key:active { transform: translateY(1px) scale(0.98); }
    .key:focus-visible { outline: 3px solid rgba(170, 153, 255, 0.85); outline-offset: 2px; }

    .key.utility { color: #ffb8d1; background: rgba(255, 109, 158, 0.15); }
    .key.utility:hover { background: rgba(255, 109, 158, 0.25); }
    .key.operator { color: #eae5ff; background: rgba(141, 113, 255, 0.25); }
    .key.operator:hover { background: rgba(141, 113, 255, 0.39); }
    .key.equals {
      grid-column: span 2;
      color: white;
      background: linear-gradient(135deg, var(--teal), #1b9c9e);
      box-shadow: 0 9px 20px rgba(43, 194, 170, 0.24);
    }
    .key.equals:hover { background: linear-gradient(135deg, #38d1b8, #1ea6a6); }
    .key.zero { grid-column: span 2; }

    .history-panel {
      min-height: 470px;
      display: flex;
      flex-direction: column;
      padding: 23px;
      border-radius: 26px;
      color: var(--text);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
    }

    .history-header h2 { margin: 0; font-size: 1rem; letter-spacing: -0.02em; }

    .clear-history {
      border: 0;
      padding: 5px 0;
      cursor: pointer;
      color: #c7bcff;
      font-size: 0.75rem;
      font-weight: 700;
      background: transparent;
    }

    .clear-history:hover { color: white; }
    .clear-history:focus-visible { outline: 2px solid #c7bcff; outline-offset: 3px; border-radius: 3px; }

    .history-list {
      display: grid;
      gap: 10px;
      align-content: start;
      flex: 1;
      overflow: auto;
      margin: 17px -4px 0;
      padding: 1px 4px;
      scrollbar-width: thin;
      scrollbar-color: #525a86 transparent;
    }

    .history-item {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 13px;
      cursor: pointer;
      color: var(--text);
      text-align: right;
      background: rgba(255, 255, 255, 0.045);
      transition: background 140ms ease, transform 140ms ease;
    }

    .history-item:hover { background: rgba(255,255,255,0.09); transform: translateX(-2px); }
    .history-item:focus-visible { outline: 2px solid #b4a6ff; outline-offset: 2px; }
    .history-equation { display: block; overflow-wrap: anywhere; color: var(--muted); font-size: 0.73rem; font-weight: 600; }
    .history-answer { display: block; margin-top: 4px; overflow-wrap: anywhere; font-size: 1rem; font-weight: 750; }

    .empty-history {
      align-self: center;
      margin: auto 0;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 14px;
      color: #c5bbff;
      font-size: 1.2rem;
      background: rgba(141, 113, 255, 0.13);
    }

    .history-note {
      margin: 16px 0 0;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.45;
    }

    @media (max-width: 660px) {
      body { padding: 14px; }
      .app { max-width: 430px; grid-template-columns: 1fr; }
      .calculator { border-radius: 25px; padding: 18px; }
      .history-panel { min-height: 180px; padding: 19px; border-radius: 22px; }
      .history-list { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 182px; }
      .empty-history { grid-column: 1 / -1; margin: 11px 0; }
      .display { min-height: 139px; }
    }

    @media (max-width: 360px) {
      .keyboard-hint { display: none; }
      .keypad { gap: 8px; }
      .key { min-height: 54px; border-radius: 14px; }
      .history-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Calculator application">
    <section class="calculator" aria-labelledby="calculator-title">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">+</div>
          <div>
            <p class="eyebrow">Smart calculator</p>
            <h1 id="calculator-title">Nova</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="mode-toggle" id="mode-toggle" type="button" aria-pressed="false">Scientific</button>
          <span class="keyboard-hint">Keyboard enabled</span>
        </div>
      </header>

      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression-display"></div>
        <div class="result" id="result-display">0</div>
      </div>

      <div class="keypad" aria-label="Calculator keys">
        <button class="key operator scientific-key" type="button" data-function="sin" aria-label="Sine in degrees" hidden>sin</button>
        <button class="key operator scientific-key" type="button" data-function="cos" aria-label="Cosine in degrees" hidden>cos</button>
        <button class="key operator scientific-key" type="button" data-function="tan" aria-label="Tangent in degrees" hidden>tan</button>
        <button class="key operator scientific-key" type="button" data-function="sqrt" aria-label="Square root" hidden>√</button>
        <button class="key operator scientific-key" type="button" data-function="square" aria-label="Square" hidden>x²</button>
        <button class="key operator scientific-key" type="button" data-function="ln" aria-label="Natural logarithm" hidden>ln</button>
        <button class="key operator scientific-key" type="button" data-function="log" aria-label="Base 10 logarithm" hidden>log</button>
        <button class="key operator scientific-key" type="button" data-function="factorial" aria-label="Factorial" hidden>n!</button>
        <button class="key operator scientific-key" type="button" data-function="reciprocal" aria-label="Reciprocal" hidden>1/x</button>
        <button class="key operator scientific-key" type="button" data-constant="pi" aria-label="Pi" hidden>π</button>
        <button class="key operator scientific-key" type="button" data-constant="e" aria-label="Euler's number" hidden>e</button>
        <button class="key operator scientific-key" type="button" data-operator="^" aria-label="Raise to a power" hidden>xʸ</button>
        <button class="key utility" type="button" data-action="clear" aria-label="Clear all">AC</button>
        <button class="key utility" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="key operator" type="button" data-operator="%" aria-label="Modulo">%</button>
        <button class="key operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button class="key" type="button" data-number="7">7</button>
        <button class="key" type="button" data-number="8">8</button>
        <button class="key" type="button" data-number="9">9</button>
        <button class="key operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button class="key" type="button" data-number="4">4</button>
        <button class="key" type="button" data-number="5">5</button>
        <button class="key" type="button" data-number="6">6</button>
        <button class="key operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button class="key" type="button" data-number="1">1</button>
        <button class="key" type="button" data-number="2">2</button>
        <button class="key" type="button" data-number="3">3</button>
        <button class="key operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="key zero" type="button" data-number="0">0</button>
        <button class="key" type="button" data-number="." aria-label="Decimal point">.</button>
        <button class="key equals" type="button" data-action="equals" aria-label="Calculate">=</button>
      </div>
    </section>

    <aside class="history-panel" aria-labelledby="history-title">
      <div class="history-header">
        <h2 id="history-title">Recent calculations</h2>
        <button class="clear-history" id="clear-history" type="button">Clear history</button>
      </div>
      <div class="history-list" id="history-list"></div>
      <p class="history-note">Select a result to use it again. Your recent calculations stay available in this browser.</p>
    </aside>
  </main>

  <script>
    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷", "%": "%", "^": "^" };
    const resultDisplay = document.getElementById("result-display");
    const expressionDisplay = document.getElementById("expression-display");
    const historyList = document.getElementById("history-list");
    const clearHistoryButton = document.getElementById("clear-history");
    const modeToggle = document.getElementById("mode-toggle");
    const scientificKeys = document.querySelectorAll(".scientific-key");
    const storageKey = "nova-calculator-history";

    const state = {
      current: "0",
      previous: null,
      operator: null,
      overwrite: false,
      error: false,
      history: loadHistory()
    };

    function loadHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        return Array.isArray(saved) ? saved.slice(0, 8) : [];
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state.history));
      } catch {
        // The calculator works normally when browser storage is unavailable.
      }
    }

    function formatValue(value) {
      if (value === "Error") return value;
      const number = Number(value);
      if (!Number.isFinite(number)) return "Error";
      if (value.endsWith(".")) return value;
      return new Intl.NumberFormat("en-US", { maximumFractionDigits: 10 }).format(number);
    }

    function readableExpression() {
      return state.previous !== null && state.operator
        ? `${formatValue(state.previous)} ${symbols[state.operator]}`
        : "";
    }

    function updateDisplay() {
      expressionDisplay.textContent = readableExpression();
      resultDisplay.textContent = formatValue(state.current);
      resultDisplay.classList.toggle("error", state.error);
    }

    function resetError() {
      if (state.error) {
        state.current = "0";
        state.previous = null;
        state.operator = null;
        state.overwrite = false;
        state.error = false;
      }
    }

    function appendNumber(value) {
      resetError();
      if (value === "." && state.current.includes(".") && !state.overwrite) return;

      if (state.overwrite) {
        state.current = value === "." ? "0." : value;
        state.overwrite = false;
      } else if (value === ".") {
        state.current += ".";
      } else if (state.current === "0") {
        state.current = value;
      } else if (state.current === "-0") {
        state.current = `-${value}`;
      } else if (state.current.replace("-", "").length < 15) {
        state.current += value;
      }
      updateDisplay();
    }

    function clearAll() {
      state.current = "0";
      state.previous = null;
      state.operator = null;
      state.overwrite = false;
      state.error = false;
      updateDisplay();
    }

    function deleteLast() {
      resetError();
      if (state.overwrite) return;
      state.current = state.current.length > 1 ? state.current.slice(0, -1) : "0";
      if (state.current === "-") state.current = "0";
      updateDisplay();
    }

    function calculate() {
      if (state.previous === null || !state.operator || state.error) return false;
      const first = Number(state.previous);
      const second = Number(state.current);
      let answer;

      switch (state.operator) {
        case "+": answer = first + second; break;
        case "-": answer = first - second; break;
        case "*": answer = first * second; break;
        case "/": answer = second === 0 ? null : first / second; break;
        case "%": answer = second === 0 ? null : first % second; break;
        case "^": answer = first ** second; break;
      }

      const equation = `${formatValue(state.previous)} ${symbols[state.operator]} ${formatValue(state.current)}`;
      state.previous = null;
      state.operator = null;
      state.overwrite = true;

      if (answer === null || !Number.isFinite(answer)) {
        state.current = "Error";
        state.error = true;
        updateDisplay();
        return false;
      }

      state.current = String(Number.parseFloat(answer.toPrecision(12)));
      state.error = false;
      addHistory(equation, state.current);
      updateDisplay();
      return true;
    }

    function chooseOperator(operator) {
      resetError();
      if (state.operator && state.previous !== null && !state.overwrite) calculate();
      state.previous = state.current;
      state.operator = operator;
      state.overwrite = true;
      updateDisplay();
    }

    function applyScientificFunction(operation) {
      resetError();
      const value = Number(state.current);
      let answer;
      let equation;

      switch (operation) {
        case "sin":
          answer = Math.sin(value * Math.PI / 180);
          if (Math.abs(answer) < 1e-12) answer = 0;
          equation = `sin(${formatValue(state.current)}°)`;
          break;
        case "cos":
          answer = Math.cos(value * Math.PI / 180);
          if (Math.abs(answer) < 1e-12) answer = 0;
          equation = `cos(${formatValue(state.current)}°)`;
          break;
        case "tan":
          const normalizedAngle = ((value % 180) + 180) % 180;
          answer = Math.abs(normalizedAngle - 90) < 1e-12
            ? null
            : Math.tan(value * Math.PI / 180);
          if (answer !== null && Math.abs(answer) < 1e-12) answer = 0;
          equation = `tan(${formatValue(state.current)}°)`;
          break;
        case "sqrt":
          answer = value < 0 ? null : Math.sqrt(value);
          equation = `√(${formatValue(state.current)})`;
          break;
        case "square":
          answer = value ** 2;
          equation = `(${formatValue(state.current)})²`;
          break;
        case "ln":
          answer = value <= 0 ? null : Math.log(value);
          equation = `ln(${formatValue(state.current)})`;
          break;
        case "log":
          answer = value <= 0 ? null : Math.log10(value);
          equation = `log(${formatValue(state.current)})`;
          break;
        case "factorial":
          if (!Number.isInteger(value) || value < 0 || value > 170) {
            answer = null;
          } else {
            answer = 1;
            for (let factor = 2; factor <= value; factor += 1) answer *= factor;
          }
          equation = `${formatValue(state.current)}!`;
          break;
        case "reciprocal":
          answer = value === 0 ? null : 1 / value;
          equation = `1 / ${formatValue(state.current)}`;
          break;
      }

      if (answer === null || !Number.isFinite(answer)) {
        state.current = "Error";
        state.previous = null;
        state.operator = null;
        state.overwrite = true;
        state.error = true;
        updateDisplay();
        return;
      }

      state.current = String(Number.parseFloat(answer.toPrecision(12)));
      state.overwrite = true;
      state.error = false;
      addHistory(equation, state.current);
      updateDisplay();
    }

    function setScientificMode(enabled) {
      modeToggle.setAttribute("aria-pressed", String(enabled));
      scientificKeys.forEach((key) => { key.hidden = !enabled; });
    }

    modeToggle.addEventListener("click", () => {
      setScientificMode(modeToggle.getAttribute("aria-pressed") !== "true");
    });

    function addHistory(equation, answer) {
      state.history.unshift({ equation, answer });
      state.history = state.history.slice(0, 8);
      saveHistory();
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = "";
      clearHistoryButton.hidden = state.history.length === 0;

      if (state.history.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.innerHTML = '<div class="empty-icon" aria-hidden="true">◷</div><strong>No calculations yet</strong><br>Results will appear here.';
        historyList.append(empty);
        return;
      }

      state.history.forEach((entry) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "history-item";
        item.setAttribute("aria-label", `Use result ${formatValue(entry.answer)}`);
        item.innerHTML = `<span class="history-equation">${entry.equation}</span><span class="history-answer">= ${formatValue(entry.answer)}</span>`;
        item.addEventListener("click", () => {
          state.current = entry.answer;
          state.previous = null;
          state.operator = null;
          state.overwrite = true;
          state.error = false;
          updateDisplay();
        });
        historyList.append(item);
      });
    }

    document.querySelector(".keypad").addEventListener("click", (event) => {
      const key = event.target.closest("button");
      if (!key) return;
      if (key.dataset.number !== undefined) appendNumber(key.dataset.number);
      if (key.dataset.operator) chooseOperator(key.dataset.operator);
      if (key.dataset.function) applyScientificFunction(key.dataset.function);
      if (key.dataset.constant) {
        const constant = key.dataset.constant === "pi" ? Math.PI : Math.E;
        state.current = String(Number.parseFloat(constant.toPrecision(12)));
        state.overwrite = true;
        state.error = false;
        updateDisplay();
      }
      if (key.dataset.action === "clear") clearAll();
      if (key.dataset.action === "delete") deleteLast();
      if (key.dataset.action === "equals") calculate();
    });

    clearHistoryButton.addEventListener("click", () => {
      state.history = [];
      saveHistory();
      renderHistory();
    });

    document.addEventListener("keydown", (event) => {
      const key = event.key;
      if (/^\d$/.test(key) || key === ".") {
        event.preventDefault();
        appendNumber(key);
      } else if (["+", "-", "*", "/", "%", "^"].includes(key)) {
        event.preventDefault();
        chooseOperator(key);
      } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
      } else if (key === "Backspace") {
        event.preventDefault();
        deleteLast();
      } else if (key === "Escape" || key === "Delete") {
        event.preventDefault();
        clearAll();
      }
    });

    renderHistory();
    updateDisplay();
  </script>
</body>
</html>
